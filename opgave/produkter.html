<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Vores Produkter</h1>
    </header>

    <main>
        <section>
            <!-- Produkt 1 -->
            <article>
                <h2>Kaffekop</h2>
                <img src="https://via.placeholder.com/150" alt="Kaffekop">
                <p>En minimalistisk keramikkop til den perfekte morgenkaffe.</p>
                <p><strong>Pris:</strong> 149 kr.</p>
                <button type="button">Læg i kurv</button>
            </article>

            <hr>

            <!-- Produkt 2 -->
            <article>
                <h2>Trådløst Headset</h2>
                <img src="https://via.placeholder.com/150" alt="Trådløst Headset">
                <p>God lydkvalitet og op til 20 timers batterilevetid.</p>
                <p><strong>Pris:</strong> 599 kr.</p>
                <button type="button">Læg i kurv</button>
            </article>

            <hr>

            <!-- Produkt 3 -->
            <article>
                <h2>Notesbog</h2>
                <img src="https://via.placeholder.com/150" alt="Notesbog">
                <p>Perfekt til dine skitser, ideer og daglige to-do lister.</p>
                <p><strong>Pris:</strong> 89 kr.</p>
                <button type="button">Læg i kurv</button>
            </article>
        </section>
    </main>

</body>
</html>
