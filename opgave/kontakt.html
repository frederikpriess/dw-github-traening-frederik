<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Kontakt Os</h1>
    </header>

    <main>
        <section>
            <h2>Send os en besked</h2>
            
            <form action="#" method="POST">
                <p>
                    <label for="name">Navn:</label><br>
                    <input type="text" id="name" name="name" placeholder="Dit navn" required>
                </p>

                <p>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" placeholder="din@email.dk" required>
                </p>

                <p>
                    <label for="subject">Emne:</label><br>
                    <input type="text" id="subject" name="subject" placeholder="Hvad drejer det sig om?">
                </p>

                <p>
                    <label for="message">Besked:</label><br>
                    <textarea id="message" name="message" rows="5" placeholder="Skriv din besked her..." required></textarea>
                </p>

                <p>
                    <button type="submit">Send besked</button>
                </p>
            </form>
        </section>

        <hr>

        <section>
            <h2>Kontaktinformation</h2>
            <p><strong>Adresse:</strong> Testvej 12, 8000 Aarhus</p>
            <p><strong>Telefon:</strong> +45 12 34 56 78</p>
            <p><strong>E-mail:</strong> kontakt@virksomhed.dk</p>
        </section>
    </main>

    <footer>
        <p><small>&copy; 2026 Vores Virksomhed. Alle rettigheder forbeholdes.</small></p>
    </footer>

</body>
</html>
